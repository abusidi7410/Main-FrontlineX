# Render blueprint for the Frontline Nexus Django backend.
# Push to GitHub, then deploy via "New +" > "Blueprint" in Render,
# or run deploy via the Render Dashboard using the repo.
services:
# ── Edge proxy (firewall-layer rate limiting) ────────────────────────────────
# Sits in front of the backend: auth 5r/m, payments 10r/m, standard 60r/m per
# client IP, enforced in Nginx. Throttled requests get a 429 and never reach
# Django. After deploying, point the app's VITE_API_URL at THIS service URL
# (e.g. https://frontlinex-edge.onrender.com) so all /api/ traffic flows
# through the edge.
  - type: web
    name: frontlinex-edge
    runtime: docker
    rootDir: nginx
    plan: free
    healthCheckPath: /admin/login/
    envVars:
      # Render internal hostname of the backend service (same account/region):
      - key: UPSTREAM_URL
        sync: false

  - type: web
    name: frontlinex-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        # The frontend that actually calls this API. It is deployed to
        # Cloudflare Workers (Nitro/wrangler), NOT Netlify — an origin that
        # does not match the live site's host is rejected by django-cors-headers
        # and every request fails, so keep this in step with the deployed
        # frontend URL. Comma-separate to allow more than one origin.
        value: https://abusidi7410-main-frontlinex.2027frontline.workers.dev,https://frontlinex-school.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: true
      - key: REDIS_URL
        sync: false
      # Set this secret from the Cloudinary console environment URL. Image
      # bytes are stored by Cloudinary; Django persists only each asset ID.
      - key: CLOUDINARY_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://abusidi7410-main-frontlinex.2027frontline.workers.dev/subscription
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: 30
      - key: JWT_REFRESH_TOKEN_DAYS
        value: 7

# ── Daily automation sweeps ──────────────────────────────────────────────────
# Time-based events (missing registers, expiring subscriptions, outstanding-
# balance SMS) cannot fire from inside a request, so they run once a day here.
# Both commands are idempotent: a re-run on the same day adds nothing, and a
# missed day self-heals on the next run. 06:00 UTC ~ 07:00 WAT.
  - type: cron
    name: frontlinex-sweeps
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 6 * * *"
    buildCommand: ./build.sh
    command: >
      python manage.py sweep_notifications &&
      python manage.py sweep_balance_reminders
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: true
      - key: REDIS_URL
        sync: false
      # SMS provider for balance reminders. Without these the console
      # provider is used and reminders only print to the cron log.
      - key: SMS_PROVIDER
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false