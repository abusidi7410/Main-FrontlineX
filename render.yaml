# Render blueprint for the Frontline Nexus Django backend.
# Push to GitHub, then deploy via "New +" > "Blueprint" in Render,
# or run deploy via the Render Dashboard using the repo.
services:
# ── Edge proxy (firewall-layer rate limiting) ────────────────────────────────
# Sits in front of the backend: auth 5r/m, payments 10r/m, standard 60r/m per
# client IP, enforced in Nginx. Throttled requests get a 429 and never reach
# Django. After deploying, point the app's VITE_API_URL at THIS service URL
# (e.g. https://frontlinex-edge.onrender.com) so all /api/ traffic flows
# through the edge.
  - type: web
    name: frontlinex-edge
    runtime: docker
    rootDir: nginx
    plan: free
    healthCheckPath: /admin/login/
    envVars:
      # Render internal hostname of the backend service (same account/region):
      - key: UPSTREAM_URL
        sync: false

  - type: web
    name: frontlinex-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /admin/login/
    envVars:
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontlinex-school.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: true
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: 30
      - key: JWT_REFRESH_TOKEN_DAYS
        value: 7