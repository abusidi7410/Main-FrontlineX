# Auto-redeploy the Railway backend on every backend push.
#
# Why this exists: the Railway dashboard's GitHub auto-deploy can silently be
# off (wrong repo/branch linked, toggle disabled). This workflow guarantees a
# redeploy on push without relying on that toggle.
#
# ONE-TIME SETUP (repo owner, 1 minute):
#   1. Railway → backend service → Settings → Deploy Hooks → Create Hook
#      (name it e.g. "github-push").
#   2. GitHub repo → Settings → Secrets and variables → Actions → Secrets:
#        RAILWAY_DEPLOY_HOOK_URL = <the hook URL>
# Done. Every push touching the backend triggers a Railway redeploy.
#
# No Railway token or IDs needed: the hook URL itself is the credential.
# Keep it secret — anyone with it can trigger (not configure) redeploys.

name: Redeploy Railway backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'nginx/**'

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Railway deploy hook
        env:
          HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RAILWAY_DEPLOY_HOOK_URL secret is not set. Create a Deploy Hook in Railway (service → Settings → Deploy Hooks) and save its URL as an Actions secret with that name."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK_URL")
          echo "Railway hook responded with HTTP $code"
          case "$code" in
            200|201|202|204) echo "Redeploy triggered." ;;
            *) echo "::error::Unexpected response $code from Railway deploy hook."; exit 1 ;;
          esac
